services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]          # REST + web UI: http://localhost:6333/dashboard
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data           # documents + uploads
      - fastembed_cache:/app/.cache/fastembed   # models download once
    depends_on: [qdrant]

volumes:
  qdrant_data:
  fastembed_cache:
