[project]
name = "rag-service"
version = "0.1.0"
description = "Production-style RAG: idempotent ingestion, Qdrant hybrid search, reranking, corrective RAG on LangGraph, citations, evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-anthropic>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.0",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "pymupdf4llm>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rag = "rag_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.File", "fastapi.Depends"]
